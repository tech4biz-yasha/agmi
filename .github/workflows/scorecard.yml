name: scorecard

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # weekly re-measurement against latest releases

jobs:
  measure:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,langgraph,openai-agents,llamaindex,letta,mem0,inspeximus]"
      - name: Lint (correctness only)
        run: ruff check agmi tests
      - name: Tests
        env:
          PYTHONPATH: .
          MEM0_TELEMETRY: "false"
        run: python -m pytest tests/ -q -p no:warnings
      - name: LangGraph encrypted-checkpointer replay (measured, not fatal)
        env:
          PYTHONPATH: .
        run: python -m agmi.replay
      - name: Scorecard
        env:
          PYTHONPATH: .
          MEM0_TELEMETRY: "false"
        run: |
          python agmi/full_runner.py --json results/ci-${{ matrix.python-version }}.json 2>/dev/null | grep -E "attack versions|\|"
      - name: Published tables match the committed results file
        env:
          PYTHONPATH: .
        run: python -m agmi.render results/scorecard.json docs/scorecard.md --check
      - name: The site matches the committed results file
        run: python site/build.py --check
      - name: This run agrees with the committed results file on every cell both measured
        env:
          PYTHONPATH: .
        run: python -m agmi.render results/scorecard.json --compare results/ci-${{ matrix.python-version }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard-${{ matrix.python-version }}
          path: results/ci-${{ matrix.python-version }}.json

  embedder-rows:
    # The cells that rank with a real sentence embedder, measured by a
    # machine nobody owns. Opt-in locally; always here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-${{ runner.os }}-v1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mem0,langgraph,letta,embedder]"
      - name: Embedder-tier tests
        env:
          PYTHONPATH: .
          MEM0_TELEMETRY: "false"
        run: python -m pytest tests/ -q -p no:warnings -m embedder
      - name: Front-door rows with a real embedder
        env:
          PYTHONPATH: .
          MEM0_TELEMETRY: "false"
        run: |
          python -m agmi.measure --target mem0 --embedder minilm 2>/dev/null
          python -m agmi.measure --target langgraph-store --embedder minilm 2>/dev/null
          python -m agmi.measure --target letta-archival --embedder minilm 2>/dev/null
