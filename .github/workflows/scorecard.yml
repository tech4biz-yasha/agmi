name: scorecard

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # weekly re-measurement against latest releases

jobs:
  measure:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,langgraph,letta,mem0,inspeximus]"
      - name: Tests
        env:
          PYTHONPATH: .
          MEM0_TELEMETRY: "false"
        run: python -m pytest tests/ -q -p no:warnings
      - name: Scorecard
        env:
          PYTHONPATH: .
          MEM0_TELEMETRY: "false"
        run: python agmi/full_runner.py 2>/dev/null | grep "|"
