[project]
name = "agent-memory-integrity"
version = "0.5.0"
description = "Agent Memory Integrity (agmi): a conformance test suite that measures whether AI agent memory and checkpoint stores notice tampering"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Yasha Khandelwal", email = "yasha.khandelwal@tech4biz.io"}]
maintainers = [{name = "Yasha Khandelwal", email = "yasha.khandelwal@tech4biz.io"}]
requires-python = ">=3.10"
keywords = ["ai-agents", "agent-memory", "integrity", "security", "langgraph", "letta", "mem0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]
langgraph = ["langgraph-checkpoint-sqlite", "pycryptodome"]
letta = ["letta", "asyncpg", "psycopg2-binary", "pgvector", "pgserver"]
mem0 = ["mem0ai", "qdrant-client"]
inspeximus = ["inspeximus[crypto]>=2.38.0"]
# A real sentence embedder for the memory-specific Mem0 cells. Pulls in
# torch; the model (about 90 MB) is fetched once and cached locally.
embedder = ["sentence-transformers"]

[project.scripts]
agmi = "agmi.runner:main"
agmi-check = "agmi.check:main"

[project.urls]
Homepage = "https://agentmemoryintegrity.org/"
Repository = "https://github.com/tech4biz-yasha/agmi"
Issues = "https://github.com/tech4biz-yasha/agmi/issues"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Only the library is a package. docs/, results/ and tests/ sit beside it.
include = ["agmi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "embedder: needs sentence-transformers and a cached all-MiniLM-L6-v2; run with: pytest -m embedder",
    "live: needs a real hosted-model key (OPENAI_API_KEY); run with: pytest -m live",
]
# The default run is the offline suite. Tests that need a downloaded model
# or a hosted key are opted into with `pytest -m embedder` / `pytest -m live`.
addopts = "-m 'not embedder and not live'"
# Deprecation notices raised inside the tools under test are theirs, not
# agmi's; they would otherwise bury the test output.
filterwarnings = [
    "ignore::DeprecationWarning:letta.*",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Correctness only: undefined names, unused imports, syntax. Style stays
# the contributor's; the point is that a broken adapter cannot land.
select = ["E4", "E7", "E9", "F"]
